packages:
  - "apps/*"
  - "packages/*"
  - "infrastructure/*"

# @hookform/resolvers/zod imports `zod` without declaring it as a dependency (it expects the
# consumer to provide one). With two zod majors in the workspace (apps/web etc. on zod 3;
# astro/@astrojs/sitemap on zod 4, used only by apps/site), pnpm's phantom-dependency fallback
# for undeclared imports can resolve that bare `zod` import to whichever major it last hoisted,
# breaking apps/web's typecheck non-deterministically across installs. Pin it explicitly to the
# major apps/web actually uses.
packageExtensions:
  "@hookform/resolvers":
    dependencies:
      zod: "^3.23.8"